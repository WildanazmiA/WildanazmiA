    </clipPath>
  </defs>
  <style>
    text { font-family: 'Courier New', Courier, monospace; font-size: 14px; white-space: pre; }
    .front { fill: #e6edf3; }
    .shadow { fill: #484f58; }
  </style>
  <rect width="644" height="168" rx="10" fill="#0d1117" />
