<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Wildan, Cybersecurity Enthusiast">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#041C38"/><stop offset="1" stop-color="#0C3B57"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#810D10"/><stop offset="1" stop-color="#DE0202"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tick" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#DCB318" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#DCB318"/>
      <stop offset="1" stop-color="#DCB318" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#C4CBCB" stroke-opacity="0.05"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>

    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;-24 0;0 0" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="4s" begin="0s" repeatCount="indefinite"/>
      <polygon points="900,0 1060,0 860,320 700,320" fill="url(#red)" opacity="0.95"/>
      <polygon points="900,0 1060,0 860,320 700,320" fill="url(#shine)">
        <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;1" dur="4s" repeatCount="indefinite"/>
      </polygon>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;-24 0;0 0" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="4s" begin="0.35s" repeatCount="indefinite"/>
      <polygon points="1075,0 1105,0 905,320 875,320" fill="#DCB318">
        <animate attributeName="opacity" values="1;0.65;1" dur="4s" begin="0.35s" repeatCount="indefinite"/>
      </polygon>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;-24 0;0 0" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="4s" begin="0.7s" repeatCount="indefinite"/>
      <polygon points="1120,0 1135,0 935,320 920,320" fill="#C4CBCB" opacity="0.85"/>
    </g>

    <rect x="0" y="312" width="1200" height="8" fill="#DE0202"/>
    <rect x="-300" y="312" width="300" height="8" fill="url(#tick)">
      <animate attributeName="x" values="-300;1200" dur="3s" repeatCount="indefinite"/>
    </rect>

    <text x="60" y="62" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="20" fill="#DCB318">root@wildan:~$ whoami<tspan fill="#DE0202">_<animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/></tspan></text>

    <g opacity="0">
      <animate attributeName="opacity" values="0;0;0.9;0.9;0;0" keyTimes="0;0.030;0.130;0.860;0.950;1" dur="8s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="-40 0;-40 0;0 0;0 0" keyTimes="0;0.030;0.130;1" dur="8s" repeatCount="indefinite"/>
      <text x="66" y="196" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="118" font-weight="900" letter-spacing="10" fill="#DE0202">WILDAN</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1.0;1.0;0;0" keyTimes="0;0.000;0.100;0.860;0.950;1" dur="8s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="-40 0;-40 0;0 0;0 0" keyTimes="0;0.000;0.100;1" dur="8s" repeatCount="indefinite"/>
      <text x="60" y="190" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="118" font-weight="900" letter-spacing="10" fill="#C4CBCB">WILDAN</text>
    </g>

    <text x="62" y="240" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="28" font-weight="600" fill="#C4CBCB" opacity="0">Moh. Wildan Azmi Abdullah
      <animate attributeName="opacity" values="0;0;1.0;1.0;0;0" keyTimes="0;0.090;0.170;0.860;0.950;1" dur="8s" repeatCount="indefinite"/></text>
    <text x="62" y="272" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="19" fill="#DCB318" opacity="0">Informatics Engineering Student  ·  Cybersecurity Enthusiast
      <animate attributeName="opacity" values="0;0;1.0;1.0;0;0" keyTimes="0;0.140;0.220;0.860;0.950;1" dur="8s" repeatCount="indefinite"/></text>
    <text x="62" y="297" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="19" fill="#AEA4A2" opacity="0">Aspiring Junior Pentester
      <animate attributeName="opacity" values="0;0;1.0;1.0;0;0" keyTimes="0;0.190;0.270;0.860;0.950;1" dur="8s" repeatCount="indefinite"/></text>

    <circle cx="1130" cy="36" r="6" fill="#DE0202"/>
    <circle cx="1152" cy="36" r="6" fill="#DCB318"/>
    <circle cx="1174" cy="36" r="6" fill="#989A9B"/>
  </g>
</svg>
