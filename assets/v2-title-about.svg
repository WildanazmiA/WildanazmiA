<svg xmlns="http://www.w3.org/2000/svg" width="900" height="60" viewBox="0 0 900 60" role="img" aria-label="About me">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#DE0202"/><stop offset="1" stop-color="#DE0202" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#DCB318" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#DCB318"/>
      <stop offset="1" stop-color="#DCB318" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="900" height="60" rx="10" fill="#041C38"/>
  <rect x="16" y="13" width="6" height="34" rx="3" fill="#DE0202">
    <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
  </rect>
  <text x="38" y="38" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="16" fill="#DCB318">01</text>
  <text x="76" y="39" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="24" font-weight="800" letter-spacing="3" fill="#C4CBCB">ABOUT ME</text>
  <rect x="0" y="56" width="900" height="2" fill="url(#line)"/>
  <rect x="-220" y="55" width="220" height="4" rx="2" fill="url(#sweep)">
    <animate attributeName="x" values="-220;900" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>
